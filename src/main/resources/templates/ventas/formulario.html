<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Nueva venta')}"></head>
<body>
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="container py-4">
    <h1 class="h3 mb-3">Nueva venta</h1>

    <div th:replace="~{fragmentos :: mensajes}"></div>

    <form th:action="@{/ventas}" method="post" class="card card-body" style="max-width: 600px">
        <div class="mb-3">
            <label for="clienteId" class="form-label">Cliente</label>
            <select id="clienteId" name="clienteId" class="form-select" required>
                <option value="">Elegí un cliente</option>
                <option th:each="c : ${clientes}" th:value="${c.id}" th:selected="${c.id == clienteId}"
                        th:text="${c.nombre + ' ' + c.apellido + ' (saldo $' + c.saldo + ')'}">Ana Perez</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="productoId" class="form-label">Producto</label>
            <select id="productoId" name="productoId" class="form-select" required>
                <option value="">Elegí un producto</option>
                <option th:each="p : ${productos}" th:value="${p.id}" th:selected="${p.id == productoId}"
                        th:text="${p.nombre + ' - $' + p.precio + ' (stock ' + p.stock + ')'}">Leche entera</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="cantidad" class="form-label">Cantidad</label>
            <input type="number" id="cantidad" name="cantidad" th:value="${cantidad}"
                   class="form-control" min="1" required>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Registrar venta</button>
            <a href="/ventas" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
