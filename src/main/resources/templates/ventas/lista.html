<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Ventas')}"></head>
<body>
<!-- Listado de todas las ventas. -->
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Ventas</h1>
        <a href="/ventas/nueva" class="btn btn-success">Nueva venta</a>
    </div>

    <div th:replace="~{fragmentos :: mensajes}"></div>

    <table class="table table-striped align-middle" th:if="${!ventas.isEmpty()}">
        <thead>
        <tr>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Producto</th>
            <th class="text-end">Cantidad</th>
            <th class="text-end">Precio unitario</th>
            <th class="text-end">Total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${ventas}">
            <td th:text="${v.fecha}">2026-11-16</td>
            <td th:text="${v.cliente.nombre + ' ' + v.cliente.apellido}">Ana Perez</td>
            <td th:text="${v.producto.nombre}">Leche entera</td>
            <td class="text-end" th:text="${v.cantidad}">3</td>
            <td class="text-end" th:text="${'$' + v.precioUnitario}">$1500.50</td>
            <td class="text-end" th:text="${'$' + v.total}">$4501.50</td>
        </tr>
        </tbody>
    </table>

    <p th:if="${ventas.isEmpty()}" class="text-muted">Todavía no hay ventas registradas.</p>
</main>
</body>
</html>
