<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Productos')}"></head>
<body>
<!-- Listado de productos: busqueda, filtro por categoria, stock bajo, reponer, editar y eliminar. -->
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Productos</h1>
        <div class="d-flex gap-2">
            <a href="/productos/nuevo?tipo=Alimento" class="btn btn-success">Nuevo alimento</a>
            <a href="/productos/nuevo?tipo=Ropa" class="btn btn-success">Nueva ropa</a>
            <a href="/productos/nuevo?tipo=Electronica" class="btn btn-success">Nueva electrónica</a>
        </div>
    </div>

    <div th:replace="~{fragmentos :: mensajes}"></div>

    <div class="d-flex flex-wrap gap-2 mb-3">
        <form method="get" action="/productos" class="d-flex gap-2">
            <input type="text" name="buscar" th:value="${buscar}" class="form-control"
                   placeholder="Buscar por nombre">
            <button type="submit" class="btn btn-outline-success">Buscar</button>
        </form>
        <form method="get" action="/productos" class="d-flex gap-2">
            <select name="categoria" class="form-select">
                <option value="">Todas las categorías</option>
                <option value="Alimento" th:selected="${categoria == 'Alimento'}">Alimento</option>
                <option value="Ropa" th:selected="${categoria == 'Ropa'}">Ropa</option>
                <option value="Electronica" th:selected="${categoria == 'Electronica'}">Electrónica</option>
            </select>
            <button type="submit" class="btn btn-outline-success">Filtrar</button>
        </form>
        <a href="/productos?stockBajo=true" class="btn btn-outline-warning">Stock bajo</a>
        <a href="/productos" class="btn btn-outline-secondary">Ver todos</a>
    </div>

    <table class="table table-striped align-middle" th:if="${!productos.isEmpty()}">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Categoría</th>
            <th class="text-end">Precio</th>
            <th class="text-end">Stock (mín.)</th>
            <th>Estado</th>
            <th>Proveedor</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${productos}">
            <td th:text="${p.nombre}">Leche entera</td>
            <td th:text="${p.categoria}">Alimento</td>
            <td class="text-end" th:text="${'$' + p.precio}">$1500.50</td>
            <td class="text-end" th:text="${p.stock + ' (' + p.stockMinimo + ')'}"
                th:classappend="${p.stock < p.stockMinimo} ? 'text-danger fw-bold'">17 (5)</td>
            <td>
                <span th:if="${p.estado.name() == 'Disponible'}" class="badge bg-success">Disponible</span>
                <span th:if="${p.estado.name() == 'Sin_Stock'}" class="badge bg-danger">Sin stock</span>
            </td>
            <td th:text="${p.proveedor != null} ? ${p.proveedor.empresa} : '-'">La Serenisima</td>
            <td class="text-end text-nowrap">
                <form th:action="@{/productos/{id}/reponer(id=${p.id})}" method="post" class="d-inline-flex gap-1">
                    <input type="number" name="cantidad" min="1" value="1" class="form-control form-control-sm"
                           style="width: 70px">
                    <button type="submit" class="btn btn-sm btn-outline-success">Reponer</button>
                </form>
                <a th:href="@{/productos/{id}/editar(id=${p.id})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                <form th:action="@{/productos/{id}/eliminar(id=${p.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('¿Eliminar este producto?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${productos.isEmpty()}" class="text-muted">No hay productos para mostrar.</p>
</main>
</body>
</html>
