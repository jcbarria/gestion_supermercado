<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Producto')}"></head>
<body>
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="container py-4">
    <h1 class="h3 mb-3"
        th:text="(${productoId == null} ? 'Nuevo producto: ' : 'Modificar producto: ') + ${producto.tipo}">
        Producto
    </h1>

    <div th:replace="~{fragmentos :: mensajes}"></div>

    <form th:action="${productoId == null} ? @{/productos} : @{/productos/{id}(id=${productoId})}"
          th:object="${producto}" method="post" class="card card-body" style="max-width: 700px">
        <input type="hidden" th:field="*{tipo}">

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required>
        </div>
        <div class="row">
            <div class="col mb-3">
                <label for="precio" class="form-label">Precio ($)</label>
                <input type="number" th:field="*{precio}" class="form-control" min="0.01" step="0.01" required>
            </div>
            <div class="col mb-3">
                <label for="stock" class="form-label">Stock</label>
                <input type="number" th:field="*{stock}" class="form-control" min="0" required>
            </div>
            <div class="col mb-3">
                <label for="stockMinimo" class="form-label">Stock mínimo</label>
                <input type="number" th:field="*{stockMinimo}" class="form-control" min="0" required>
            </div>
        </div>
        <div class="mb-3">
            <label for="proveedorId" class="form-label">Proveedor</label>
            <select th:field="*{proveedorId}" class="form-select" required>
                <option value="">Elegí un proveedor</option>
                <option th:each="pr : ${proveedores}" th:value="${pr.id}"
                        th:text="${pr.empresa + ' (' + pr.nombre + ' ' + pr.apellido + ')'}">La Serenisima</option>
            </select>
        </div>

        <div th:if="*{tipo == 'Alimento'}" class="row">
            <div class="col mb-3">
                <label for="vencimiento" class="form-label">Vencimiento</label>
                <input type="date" th:field="*{vencimiento}" class="form-control">
            </div>
            <div class="col mb-3 d-flex align-items-end">
                <div class="form-check">
                    <input type="checkbox" th:field="*{refrigerado}" class="form-check-input">
                    <label for="refrigerado1" class="form-check-label">Requiere refrigeración</label>
                </div>
            </div>
        </div>

        <div th:if="*{tipo == 'Ropa'}" class="row">
            <div class="col mb-3">
                <label for="talle" class="form-label">Talle</label>
                <input type="text" th:field="*{talle}" class="form-control">
            </div>
            <div class="col mb-3">
                <label for="temporada" class="form-label">Temporada</label>
                <input type="text" th:field="*{temporada}" class="form-control">
            </div>
        </div>

        <div th:if="*{tipo == 'Electronica'}" class="row">
            <div class="col mb-3">
                <label for="marca" class="form-label">Marca</label>
                <input type="text" th:field="*{marca}" class="form-control">
            </div>
            <div class="col mb-3">
                <label for="garantia" class="form-label">Garantía (meses)</label>
                <input type="number" th:field="*{garantia}" class="form-control" min="0">
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="/productos" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
