<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Cliente')}"></head>
<body>
<!-- Alta y modificacion: si hay clienteId es una modificacion, si no es un alta. -->
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="container py-4">
    <h1 class="h3 mb-3" th:text="${clienteId == null} ? 'Nuevo cliente' : 'Modificar cliente'">Cliente</h1>

    <div th:replace="~{fragmentos :: mensajes}"></div>

    <form th:action="${clienteId == null} ? @{/clientes} : @{/clientes/{id}(id=${clienteId})}"
          th:object="${cliente}" method="post" class="card card-body" style="max-width: 600px">
        <div class="mb-3">
            <label for="dni" class="form-label">DNI</label>
            <input type="number" th:field="*{dni}" class="form-control" min="1" required>
        </div>
        <div class="row">
            <div class="col mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" required>
            </div>
            <div class="col mb-3">
                <label for="apellido" class="form-label">Apellido</label>
                <input type="text" th:field="*{apellido}" class="form-control" required>
            </div>
        </div>
        <div class="mb-3">
            <label for="saldo" class="form-label">Saldo ($)</label>
            <input type="number" th:field="*{saldo}" class="form-control" min="0" step="0.01" required>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="/clientes" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
