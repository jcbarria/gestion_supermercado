<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Clientes')}"></head>
<body>
<!-- Listado de clientes con busqueda, historial, editar y eliminar (eliminar es un form POST). -->
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Clientes</h1>
        <a href="/clientes/nuevo" class="btn btn-success">Nuevo cliente</a>
    </div>

    <div th:replace="~{fragmentos :: mensajes}"></div>

    <form method="get" action="/clientes" class="d-flex gap-2 mb-3" style="max-width: 500px">
        <input type="text" name="buscar" th:value="${buscar}" class="form-control"
               placeholder="Buscar por nombre">
        <button type="submit" class="btn btn-outline-success">Buscar</button>
        <a href="/clientes" class="btn btn-outline-secondary">Ver todos</a>
    </form>

    <table class="table table-striped align-middle" th:if="${!clientes.isEmpty()}">
        <thead>
        <tr>
            <th>DNI</th>
            <th>Nombre</th>
            <th>Saldo</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.dni}">30111222</td>
            <td th:text="${c.nombre + ' ' + c.apellido}">Ana Perez</td>
            <td th:text="${'$' + c.saldo}">$5498.50</td>
            <td class="text-end">
                <a th:href="@{/clientes/{id}/historial(id=${c.id})}" class="btn btn-sm btn-outline-primary">Historial</a>
                <a th:href="@{/clientes/{id}/editar(id=${c.id})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                <form th:action="@{/clientes/{id}/eliminar(id=${c.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('¿Eliminar este cliente?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${clientes.isEmpty()}" class="text-muted">No hay clientes para mostrar.</p>
</main>
</body>
</html>
