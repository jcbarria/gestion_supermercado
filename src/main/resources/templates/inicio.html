<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Inicio')}"></head>
<body>
<!-- Pagina de inicio. Los numeros los carga InicioControlador en el Model. -->
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="container py-4">
    <h1 class="h3 mb-4">Panel de gestión</h1>

    <div class="row g-3">
        <div class="col-sm-6 col-lg-3">
            <div class="card text-center">
                <div class="card-body">
                    <p class="text-muted mb-1">Productos</p>
                    <p class="display-6 mb-0" th:text="${cantidadProductos}">0</p>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card text-center">
                <div class="card-body">
                    <p class="text-muted mb-1">Clientes</p>
                    <p class="display-6 mb-0" th:text="${cantidadClientes}">0</p>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card text-center">
                <div class="card-body">
                    <p class="text-muted mb-1">Ventas</p>
                    <p class="display-6 mb-0" th:text="${cantidadVentas}">0</p>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card text-center border-warning">
                <div class="card-body">
                    <p class="text-muted mb-1">Con stock bajo</p>
                    <p class="display-6 mb-0" th:text="${cantidadStockBajo}">0</p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
