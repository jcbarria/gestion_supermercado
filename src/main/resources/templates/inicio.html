<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supermercado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="/">Supermercado</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/productos">Productos</a>
            <a class="nav-link" href="/clientes">Clientes</a>
            <a class="nav-link" href="/proveedores">Proveedores</a>
            <a class="nav-link" href="/ventas">Ventas</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <h1 class="h3 mb-4">Panel de gestión</h1>

    <div class="row g-3">
        <div class="col-sm-6 col-lg-3">
            <div class="card text-center">
                <div class="card-body">
                    <p class="text-muted mb-1">Productos</p>
                    <p class="display-6 mb-0" th:text="${cantidadProductos}">0</p>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card text-center">
                <div class="card-body">
                    <p class="text-muted mb-1">Clientes</p>
                    <p class="display-6 mb-0" th:text="${cantidadClientes}">0</p>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card text-center">
                <div class="card-body">
                    <p class="text-muted mb-1">Ventas</p>
                    <p class="display-6 mb-0" th:text="${cantidadVentas}">0</p>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card text-center border-warning">
                <div class="card-body">
                    <p class="text-muted mb-1">Con stock bajo</p>
                    <p class="display-6 mb-0" th:text="${cantidadStockBajo}">0</p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
