<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Proveedores')}"></head>
<body>
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Proveedores</h1>
        <a href="/proveedores/nuevo" class="btn btn-success">Nuevo proveedor</a>
    </div>

    <div th:replace="~{fragmentos :: mensajes}"></div>

    <table class="table table-striped align-middle" th:if="${!proveedores.isEmpty()}">
        <thead>
        <tr>
            <th>DNI</th>
            <th>Nombre</th>
            <th>Empresa</th>
            <th>CUIT</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${proveedores}">
            <td th:text="${p.dni}">20111222</td>
            <td th:text="${p.nombre + ' ' + p.apellido}">Juan Gomez</td>
            <td th:text="${p.empresa}">La Serenisima</td>
            <td th:text="${p.cuit}">30-12345678-9</td>
        </tr>
        </tbody>
    </table>

    <p th:if="${proveedores.isEmpty()}" class="text-muted">Todavía no hay proveedores cargados.</p>
</main>
</body>
</html>
